name: NexusFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexusflow
          POSTGRES_USER: nexusflow_user
          POSTGRES_PASSWORD: nexusflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexusflow_user -d nexusflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: latest

      - name: Install Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Ruff Linter & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Pyright Type Check
        run: |
          uv run pyright

      - name: Run Database Migrations
        env:
          NEXUSFLOW_DB__URL: postgresql+asyncpg://nexusflow_user:nexusflow_password@localhost:5432/nexusflow
        run: |
          uv run alembic upgrade head

      - name: Run Test Suite (Real PostgreSQL)
        env:
          NEXUSFLOW_DB__URL: postgresql+asyncpg://nexusflow_user:nexusflow_password@localhost:5432/nexusflow
          NEXUSFLOW_SECURITY__WORKER_DOMAIN_TOKEN: <WORKER_BEARER_SECRET>
          NEXUSFLOW_SECURITY__PUBLIC_API_TOKENS: '[{principal_id: client-dev, token: <PUBLIC_CLIENT_SECRET>, permissions: [definitions:read,definitions:write,executions:read,executions:start,executions:cancel]}]'
        run: |
          uv run pytest -v

      - name: Build Docker Compose Stack
        run: |
          docker compose build
